name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with validation dependencies
        run: python -m pip install -e ".[validation]"
      - name: Compile application and tests
        run: python -m compileall -q src tests examples
      - name: Run unit tests
        run: python -m unittest discover -s tests -v