[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrs-recovery-study"
version = "0.8.0"
description = "Read-only BMP/JPEG/PNG/PDF carving and image-structure inspection for data recovery experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1"]

[project.optional-dependencies]
validation = ["Pillow>=10", "pypdf>=5"]

[project.scripts]
pdrs = "pdrs.cli:app"
pdrs-gui = "pdrs.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

